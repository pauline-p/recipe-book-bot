<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Книга рецептов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
/* Лист в точку поверх меш-градиента, блюда — наклейки. Тема всегда светлая.
   Шрифты: Manrope для всего текста, рукописный Caveat только для названий блюд и цифр. */
:root {
  --paper: #f6f7f4; --dot: rgba(60,70,80,.16);
  --mesh-a: #f1efb6; --mesh-b: #e4f0c6; --mesh-c: #c9ddf5;
  --ink: #1f2328; --ink-2: #5c6570; --line: rgba(31,35,40,.10);
  --card: #ffffff; --chip: #f1f3ef; --accent: #3d7be0; --accent-soft: #e3edfc; --danger: #c8412f;
  --shadow: rgba(60,80,110,.22);
  --body: "Manrope", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); }
body { overflow-x: hidden; }
/* Пока открыт рецепт или форма, страница под ним не двигается */
html:has(.panel.on), html:has(.panel.on) body { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  display: inline-block; -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; }
.num { font-family: var(--hand); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.sheet-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 45% at 12% 18%, var(--mesh-a) 0%, transparent 70%),
    radial-gradient(55% 50% at 90% 30%, var(--mesh-c) 0%, transparent 72%),
    radial-gradient(70% 55% at 30% 85%, var(--mesh-b) 0%, transparent 70%),
    radial-gradient(60% 50% at 95% 95%, var(--mesh-c) 0%, transparent 70%),
    var(--paper); }
.sheet-bg::after { content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.6px); background-size: 22px 22px; background-position: 11px 11px; }

/* ---------- Главный лист ---------- */
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 24px) max(20px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 120px) max(20px, env(safe-area-inset-left)); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-weight: 700; font-size: 28px; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
.sub { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.iconbtn { border: 0; background: var(--card); color: var(--ink); width: 42px; height: 42px; flex: none; border-radius: 50%;
  display: grid; place-items: center; box-shadow: 0 2px 10px var(--shadow); cursor: pointer; }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 22px; padding: 0 6px 0 14px;
  margin-top: 16px; box-shadow: 0 2px 10px var(--shadow); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; font-size: 16px; }
.search button { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 6px; display: grid; }

.board { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 8px; padding-top: 18px; }
.sticker { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.board .sticker:nth-child(even) { margin-top: 70px; }
.pic { width: 100%; max-width: 220px; aspect-ratio: 1; display: grid; place-items: center; transform: rotate(var(--r, 0deg));
  filter: drop-shadow(0 8px 14px var(--shadow)) drop-shadow(0 1px 1px var(--shadow)); transition: transform .2s; }
.pic img { width: 100%; height: auto; display: block; }
.sticker .label { font-family: var(--hand); font-weight: 600; font-size: 23px; line-height: 1.05; text-align: center; overflow-wrap: anywhere;
  color: var(--ink); transform: rotate(calc(var(--r, 0deg) * -.6)); max-width: 100%; }
.sticker .meta { font-size: 12px; color: var(--ink-2); }
.sticker .meta .num { font-size: 20px; color: var(--ink); margin-right: 2px; }
.sticker.hop .pic { animation: hop .46s cubic-bezier(.3,.7,.4,1.4); }
@keyframes hop {
  0% { transform: rotate(var(--r)) scale(1); }
  25% { transform: rotate(calc(var(--r) - 5deg)) translateY(-18px) scale(1.12); }
  55% { transform: rotate(var(--r)) translateY(2px) scale(.95, 1.03); }
  78% { transform: rotate(var(--r)) translateY(-4px) scale(1.02); }
  100% { transform: rotate(var(--r)) scale(1); } }
.sticker:active .pic { transform: rotate(var(--r)) scale(.96); }

/* Тарелка-заглушка, пока нет иллюстрации */
.plate { width: 88%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #fbfbf9 0 52%, #e9e9e4 53% 56%, #f7f7f4 57% 86%, #ffffff 87%);
  box-shadow: 0 0 0 1.5px #d6dde8; display: grid; place-items: center; position: relative; overflow: hidden; }
.plate img { width: 38%; height: auto; }
.plate.drawing::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(61,123,224,.18) 50%, transparent 70%);
  animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.empty { grid-column: 1 / -1; text-align: center; color: var(--ink-2); padding: 64px 12px; line-height: 1.6; }
.empty .label { font-family: var(--hand); font-size: 28px; color: var(--ink); display: block; margin-bottom: 6px; }

.fab { position: fixed; z-index: 5; right: max(20px, calc(env(safe-area-inset-right) + 20px)); bottom: calc(env(safe-area-inset-bottom) + 24px);
  height: 56px; padding: 0 22px 0 16px; border: 0; border-radius: 28px; background: var(--ink); color: var(--paper); font-weight: 600;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px var(--shadow); cursor: pointer; }

/* ---------- Полноэкранные панели ---------- */
.panel { position: fixed; inset: 0; z-index: 20; background: var(--card); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  transform: translateY(100%); transition: transform .42s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.panel.on { transform: none; visibility: visible; }
.panel.form { background: var(--paper); }
.panel-in { max-width: 560px; margin: 0 auto; overflow-x: clip;
  padding: calc(env(safe-area-inset-top) + 12px) max(20px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 110px) max(20px, env(safe-area-inset-left)); }
.panel-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: 8px; z-index: 2; min-height: 40px; }
.panel-top .iconbtn { width: 40px; height: 40px; }

.hero { position: relative; margin: -4px auto 4px; width: min(76%, 300px); }
.hero .pic { max-width: none; }
.hero-bg { position: absolute; inset: -10% -30%; z-index: -1; border-radius: 40%;
  background: radial-gradient(50% 50% at 30% 40%, var(--mesh-a), transparent 70%), radial-gradient(50% 50% at 70% 60%, var(--mesh-c), transparent 70%); }
.card-title { font-weight: 700; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; text-align: center; margin: 8px 0 2px; text-wrap: balance; }
.desc { text-align: center; color: var(--ink-2); margin: 0 0 4px; }
.tags { text-align: center; font-size: 13px; color: var(--ink-2); margin-bottom: 18px; }

.kbju { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kbju div { background: var(--chip); border-radius: 16px; padding: 10px 4px 8px; text-align: center; }
.kbju b { display: block; font-family: var(--hand); font-weight: 600; font-size: 30px; line-height: 1; }
.kbju span { font-size: 11.5px; color: var(--ink-2); }
.kbju-sub { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); margin: 8px 2px 0; }
.kbju-sub .num { font-size: 19px; color: var(--ink); }

.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 8px; }
.sec h3 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 20px; padding: 3px; }
.stepper button { border: 0; background: var(--card); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.stepper button .ms { font-size: 18px; }
.stepper output { min-width: 78px; text-align: center; font-size: 13.5px; font-weight: 600; }

.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ings li:last-child { border-bottom: 0; }
.emo { width: 44px; height: 44px; border-radius: 14px; background: var(--chip); display: grid; place-items: center; }
.emo img { width: 28px; height: 28px; display: block; }
.ings .nm { min-width: 0; }
.ings .am { display: block; font-size: 12.5px; color: var(--ink-2); }
.ings .g { font-family: var(--hand); font-weight: 600; font-size: 22px; color: var(--ink-2); white-space: nowrap; }
.ings .g small { font-family: var(--body); font-size: 13px; margin-left: 2px; }

.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 8px 0; }
.steps li::before { content: counter(s); font-family: var(--hand); font-weight: 600; font-size: 26px; line-height: 1; color: var(--accent); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tips li { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; }
.notes { background: var(--chip); border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; }

.actions { display: grid; gap: 8px; margin-top: 30px; }
.btn { border: 0; height: 50px; border-radius: 25px; background: var(--chip); font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.quiet { background: none; color: var(--danger); }
.btn:disabled { opacity: .45; }

/* ---------- Формы ---------- */
.form h2 { font-weight: 700; font-size: 26px; letter-spacing: -.02em; margin: 6px 0 4px; }
label { display: block; font-size: 13px; color: var(--ink-2); margin: 18px 0 6px; }
.field { width: 100%; border: 0; background: var(--card); border-radius: 14px; padding: 12px 14px; outline: none; font-size: 16px;
  box-shadow: 0 1px 4px rgba(60,80,110,.10); }
.field:focus { box-shadow: 0 0 0 2px var(--accent); }
textarea.field { min-height: 110px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 label { margin-top: 18px; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.parse-msg { font-size: 14px; color: var(--ink-2); margin-top: 14px; min-height: 20px; text-align: center; }
.parse-msg.err { color: var(--danger); font-weight: 600; }
.ing { display: grid; grid-template-columns: 36px 1fr 78px 60px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.ing .emo { width: 36px; height: 36px; border-radius: 12px; background: var(--card); }
.ing .emo img { width: 22px; height: 22px; }
.ing .field { padding: 10px 8px; font-size: 15px; }
.x { border: 0; background: none; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; padding: 0; }
.link { border: 0; background: none; padding: 8px 0; color: var(--accent); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 12px max(20px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  background: linear-gradient(transparent, var(--paper) 30%); }
.bar .btn { width: 100%; max-width: 520px; margin: 0 auto; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 40;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 20px; font-size: 14px; transition: .3s; pointer-events: none;
  max-width: 86vw; text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.loading { grid-column: 1 / -1; padding: 64px 0; text-align: center; color: var(--ink-2); }


/* ---------- Листы-марки ---------- */
main { padding-left: 10px; padding-right: 10px; overflow-x: clip; }
.sheets { display: block; padding: 4px 0 0; }
.sheet { position: relative; transform: rotate(var(--a)); margin: 0 4px; }
.sheet + .sheet { margin-top: -34px; }
.sheet-paper { position: absolute; inset: 0; pointer-events: none;
  filter: drop-shadow(0 10px 16px rgba(80,70,30,.16)) drop-shadow(0 1px 1px rgba(80,70,30,.22)); }
.sheet-paper::before { --h: 7px; content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(90deg, transparent 36px, rgba(214,120,110,.45) 36px 37.5px, transparent 37.5px),
    repeating-linear-gradient(180deg, transparent 0 31px, rgba(120,150,190,.26) 31px 32px),
    var(--sheet, #fbf2c9);
  background-position: 0 0, 0 24px, 0 0;
  -webkit-mask: radial-gradient(var(--h) at var(--h) var(--h), #0000 97%, #000) calc(-1 * var(--h)) calc(-1 * var(--h)) / calc(3 * var(--h)) calc(3 * var(--h)) round,
          linear-gradient(#000 0 0) center / calc(100% - 2.6 * var(--h)) calc(100% - 2.6 * var(--h)) no-repeat;
  mask: radial-gradient(var(--h) at var(--h) var(--h), #0000 97%, #000) calc(-1 * var(--h)) calc(-1 * var(--h)) / calc(3 * var(--h)) calc(3 * var(--h)) round,
        linear-gradient(#000 0 0) center / calc(100% - 2.6 * var(--h)) calc(100% - 2.6 * var(--h)) no-repeat;
  mask-composite: add; }
.sheet-top { position: relative; padding: 30px 20px 0 50px; }
.sheet-top header { align-items: center; }
.sheet-top h1 { font-size: 30px; }
.sheet-top .iconbtn { box-shadow: none; background: rgba(255,255,255,.7); }
.sheet-area { position: relative; height: 650px; }
.sheet:first-child .sheet-area { height: 610px; }
.sheet .sticker { position: absolute; width: 45%; z-index: 1; }
.sheet .sticker .pic { max-width: none; }
.sheet .empty { position: absolute; inset: 40px 20px auto 40px; }
.sheet .sheet-area.flow, .sheet:first-child .sheet-area.flow { height: auto; min-height: 560px; padding: 0 22px 56px 50px; }
.sheet .sheet-area.flow .empty { position: static; padding: 90px 0 0; text-align: left; }
.howto { padding-top: 22px; color: var(--ink); }
.howto-lead { font-size: 16px; line-height: 1.5; margin: 0 0 14px; }
.howto-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.howto-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; }
.howto-steps .ms { flex: none; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.75); display: grid; place-items: center; font-size: 20px; }
.howto-steps b { font-weight: 600; }
.howto-note { font-family: var(--hand); font-size: 21px; line-height: 1.25; margin: 20px 0 0; transform: rotate(-1deg); }
.howto-plate { display: flex; justify-content: center; margin: 22px 0 6px; }
.ghost-plate { width: 150px; aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(60,70,80,.28); display: grid; place-items: center;
  text-align: center; font-family: var(--hand); font-size: 18px; line-height: 1.1; color: var(--ink-2); transform: rotate(4deg); }
.howto-btns { display: grid; gap: 10px; margin-top: 18px; }
.hbtn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 22px; padding: 12px 16px; font-weight: 600; font-size: 15px;
  cursor: pointer; background: rgba(255,255,255,.8); color: var(--ink); }
.hbtn.dark { background: var(--ink); color: #fff; }
.hbtn .ms { font-size: 20px; }

/* Фото блюда в тарелке */
.plate.photo { background: #fff; box-shadow: 0 0 0 1.5px #e3e3dc, inset 0 0 0 5px #f4f4ef; padding: 7%; }
.plate.photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.addphoto { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px auto 14px; border: 0; cursor: pointer;
  background: var(--ink); color: #fff; border-radius: 22px; padding: 10px 18px; font-weight: 600; font-size: 15px; }
.addphoto.ghost { background: rgba(255,255,255,.85); color: var(--ink); box-shadow: 0 2px 10px var(--shadow); padding: 8px 14px; font-size: 14px; }

/* ---------- Перетаскивание тарелок ---------- */
.sheets { position: relative; }
.free-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
.free-layer .sticker { position: absolute; width: 41%; pointer-events: auto; }
.sticker, .sticker * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.sticker img { -webkit-user-drag: none; }
.sticker.lifted { z-index: 200; transition: none; }
.sticker.lifted .pic { transform: rotate(var(--r)) scale(1.1); filter: drop-shadow(0 22px 26px rgba(40,40,30,.28)) drop-shadow(0 2px 2px rgba(40,40,30,.2)); }
.sticker.dropped .pic { animation: drop .32s cubic-bezier(.3,.7,.4,1.3); }
@keyframes drop { 0% { transform: rotate(var(--r)) scale(1.1); } 60% { transform: rotate(var(--r)) scale(.96); } 100% { transform: rotate(var(--r)) scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sheet-bg" aria-hidden="true"></div>

<main>
  <div id="topSlot">
  <header>
    <div>
      <h1>Мои рецепты</h1>
      <div class="sub" id="count">&nbsp;</div>
    </div>
    <button class="iconbtn" id="searchBtn" aria-label="Поиск"><span class="ms">search</span></button>
  </header>
  <div class="search" id="searchRow" hidden>
    <span class="ms" style="color:var(--ink-2)">search</span>
    <input id="q" placeholder="Блюдо или продукт" autocomplete="off">
    <button id="qClear" aria-label="Закрыть поиск"><span class="ms">close</span></button>
  </div>
  </div>
  <section class="sheets" id="board" aria-label="Рецепты"></section>
</main>
<button class="fab" id="fab"><span class="ms">add</span>Рецепт</button>

<input type="file" id="photoIn" accept="image/*" hidden>
<article class="panel" id="card" role="dialog" aria-label="Рецепт"><div class="panel-in" id="cardIn"></div></article>
<section class="panel form" id="formPanel" role="dialog" aria-label="Редактирование"><div class="panel-in" id="formIn"></div></section>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const PAPER = "#f6f7f4";
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor(PAPER); tg.setBackgroundColor(PAPER); tg.setBottomBarColor && tg.setBottomBarColor(PAPER); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  tg.BackButton.onClick(back);
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { v = Math.round((+v || 0) * 10) / 10; return String(v).replace(".", ","); };
const int = v => Math.round(+v || 0).toLocaleString("ru-RU");
const go = h => { location.hash = h; };
const icon = k => `/static/icons/flat/${encodeURIComponent(k || "jar")}.svg`;
const word = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
function back() { history.length > 1 ? history.back() : go("#/"); }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 3200); }
function haptic(type) { try { type === "tap" ? tg.HapticFeedback.impactOccurred("light") : tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

async function api(path, opts = {}) {
  // Не ждём вечно: если сервер молчит, показываем понятную ошибку
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 180000);
  let res;
  try {
    res = await fetch("/api" + path, { ...opts, signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : "", ...(opts.headers || {}) } });
  } catch (e) {
    throw new Error(ctrl.signal.aborted ? "Сервер слишком долго не отвечает. Попробуй ещё раз чуть позже."
                                        : "Нет связи с сервером. Проверь интернет и попробуй ещё раз.");
  } finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Что-то пошло не так");
  return data;
}

async function loadBoard() {
  if (!$("board").querySelector(".sheet")) drawBoard([], `<div class="empty"><span class="label">Открываю книгу…</span></div>`, "&nbsp;");
  let list;
  try { list = await api("/recipes?q=" + encodeURIComponent(query)); }
  catch (e) { drawBoard([], `<div class="empty"><span class="label">Не получилось открыть</span>${esc(e.message)}</div>`, "&nbsp;"); return; }
  items = list;
  const count = query ? `Найдено: ${items.length}` : items.length ? `${items.length} ${word(items.length, "блюдо", "блюда", "блюд")} в книге` : "твоя личная книга";
  drawBoard(items, query ? `<div class="empty"><span class="label">Ничего не нашла</span>Попробуй другое слово или продукт.</div>` : HOWTO, count);
  pollDrawing();
}
function drawBoard(items, emptyHTML, countHTML) {
  $("count").innerHTML = countHTML;
  $("fab").hidden = !items.length && emptyHTML === HOWTO;   // на пустом листе свои кнопки
  const b = $("board");
  document.querySelector("main").prepend(topSlotEl);   // заголовок переносим в первый лист заново
  b.innerHTML = "";
  const PER = 4;
  const ANGLES = [-3.5, 3, -2.5, 4, -3, 2.5];
  const SHEETS = ["#fbf2c9", "#fcf5d6", "#f9efc0"];
  // Места для 4 тарелок на листе: x в % ширины, y в px. Нечётные листы зеркальные.
  const SLOTS = [[-3, 0], [55, 60], [3, 290], [52, 340]];
  const rnd = (id, k) => { const v = Math.sin(id * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
  const pages = Math.max(1, Math.ceil(items.length / PER));
  const free = query ? null : Object.assign(document.createElement("div"), { className: "free-layer" });
  for (let pg = 0; pg < pages; pg++) {
    const sh = document.createElement("div");
    sh.className = "sheet";
    sh.style.setProperty("--a", ANGLES[pg % ANGLES.length] + "deg");
    sh.style.setProperty("--sheet", SHEETS[pg % SHEETS.length]);
    sh.style.zIndex = pg + 1;
    sh.innerHTML = `<div class="sheet-paper"></div>${pg === 0 ? `<div class="sheet-top"></div>` : ""}<div class="sheet-area"></div>`;
    if (pg === 0) sh.querySelector(".sheet-top").appendChild(topSlotEl);
    const area = sh.querySelector(".sheet-area");
    if (!items.length) { area.classList.add("flow"); area.innerHTML = emptyHTML; }
    items.slice(pg * PER, pg * PER + PER).forEach((r, k) => {
      let [x, y] = SLOTS[k];
      if (pg % 2) x = 53 - x;                          // зеркалим каждый второй лист
      x += (rnd(r.id, 1) - .5) * 14;                   // ±7% по горизонтали
      y += (rnd(r.id, 2) - .5) * 50;                   // ±25px по вертикали
      x = Math.max(-5, Math.min(56, x));               // чуть-чуть за край листа можно
      const el = document.createElement("button");
      el.className = "sticker"; el.style.setProperty("--r", tilt(r.id));
      el.style.left = x + "%"; el.style.top = Math.max(-10, y) + "px";
      el.setAttribute("aria-label", r.title);
      el.innerHTML = `<div class="pic">${picHTML(r)}</div>
        <div class="label">${esc(r.title)}</div>
        <div class="meta">${drawing(r) ? "рисую наклейку…" : `<span class="num">${int(r.nutrition.per100.kcal)}</span> ккал на 100 г`}</div>`;
      el.onclick = () => {
        if (el._dragged) { el._dragged = false; return; }   // это было перетаскивание, а не нажатие
        haptic("tap"); el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); setTimeout(() => go("#/r/" + r.id), 320);
      };
      makeDraggable(el, r);
      if (free && r.pos) { el.style.left = r.pos.x + "%"; el.style.top = r.pos.y + "px"; free.appendChild(el); }
      else area.appendChild(el);
    });
    b.appendChild(sh);
  }
  if (free) b.appendChild(free);
}

// ---------- Перетаскивание: зажать тарелку, подвинуть, отпустить ----------
let dragging = null;
document.addEventListener("touchmove", e => { if (dragging) e.preventDefault(); }, { passive: false });
function makeDraggable(el, r) {
  if (query) return;   // в поиске тарелки не двигаем
  let timer = null, start = null;
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    timer = setTimeout(() => lift(e), 380);
  });
  el.addEventListener("pointermove", e => {
    if (!dragging && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) { clearTimeout(timer); start = null; }
    if (dragging && dragging.el === el) moveTo(e.clientX, e.clientY);
  });
  const end = () => { clearTimeout(timer); start = null; if (dragging && dragging.el === el) drop(); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);

  function lift(e) {
    const b = $("board"), br = b.getBoundingClientRect(), er = el.getBoundingClientRect();
    let free = b.querySelector(".free-layer");
    if (!free) { free = document.createElement("div"); free.className = "free-layer"; b.appendChild(free); }
    if (el.parentNode !== free) {                      // переносим тарелку с листа в свободный слой, не сдвигая её
      free.appendChild(el);
      el.style.left = ((er.left - br.left) / br.width * 100) + "%";
      el.style.top = (er.top - br.top) + "px";
    }
    const now = el.getBoundingClientRect();
    dragging = { el, r, dx: start.x - now.left, dy: start.y - now.top, cx: start.x, cy: start.y };
    try { el.setPointerCapture(start.id); } catch (err) {}
    el.classList.add("lifted"); el._dragged = true;
    try { tg.HapticFeedback.impactOccurred("medium"); } catch (err) {}
    autoScroll();
  }
}
function moveTo(cx, cy) {
  const d = dragging, b = $("board"), br = b.getBoundingClientRect(), w = d.el.offsetWidth;
  d.cx = cx; d.cy = cy;
  let x = (cx - d.dx - br.left) / br.width * 100;
  let y = cy - d.dy - br.top;
  x = Math.max(-10, Math.min(100 - w / br.width * 100 + 10, x));
  y = Math.max(-20, Math.min(b.scrollHeight - 140, y));
  d.el.style.left = x + "%"; d.el.style.top = y + "px";
}
function autoScroll() {                                  // у края экрана лист сам прокручивается
  if (!dragging) return;
  const { cy } = dragging, edge = 90;
  const v = cy < edge ? -(edge - cy) / 6 : cy > innerHeight - edge ? (cy - innerHeight + edge) / 6 : 0;
  if (v) { scrollBy(0, v); moveTo(dragging.cx, dragging.cy); }
  requestAnimationFrame(autoScroll);
}
async function drop() {
  const { el, r } = dragging; dragging = null;
  el.classList.remove("lifted"); el.classList.add("dropped"); setTimeout(() => el.classList.remove("dropped"), 340);
  haptic("tap");
  const pos = { x: parseFloat(el.style.left), y: parseFloat(el.style.top) };
  r.pos = pos;
  try { await api(`/recipes/${r.id}/pos`, { method: "PUT", body: JSON.stringify(pos) }); }
  catch (e) { toast("Не получилось запомнить место: " + e.message); }
  setTimeout(() => { el._dragged = false; }, 50);
}
// Пока рисуются наклейки, раз в 6 секунд обновляем лист (не дольше 4 минут)
function pollDrawing() {
  clearTimeout(pollDrawing.t);
  if (!items.some(drawing)) { pollDrawing.n = 0; return; }
  if ((pollDrawing.n = (pollDrawing.n || 0) + 1) > 40) return;

  }, 6000);
}

async function shrinkPhoto(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}

    <div class="bar"><button class="btn solid" id="saveBtn">Сохранить</button></div>`;
  drawEdIngs();
  $("saveBtn").onclick = () => save(id);
}
function drawEdIngs() {
  $("edIngs").innerHTML = draft.ingredients.map((i, k) => `
    <div class="ing">
      <span class="emo">${i.icon ? `<img src="${icon(i.icon)}" alt="">` : ""}</span>
      <input class="field" placeholder="Продукт" value="${esc(i.name)}" oninput="setIng(${k},'name',this.value)" aria-label="Продукт">
      <input class="field" placeholder="2 ст. л." value="${esc(i.amount)}" oninput="setIng(${k},'amount',this.value)" aria-label="Количество">
      <input class="field" placeholder="г" inputmode="decimal" value="${esc(i.grams ?? "")}" oninput="setIng(${k},'grams',this.value)" aria-label="Граммы">
      <button class="x" onclick="delIng(${k})" aria-label="Убрать"><span class="ms">close</span></button>
    </div>`).join("");
}
function setIng(k, f, v) {
  const i = draft.ingredients[k];
  if (f === "name" && v.trim().toLowerCase() !== (i._orig ??= i.name).trim().toLowerCase()) {
    i.kcal = i.protein = i.fat = i.carbs = null; i.icon = null;   // другой продукт: пересчитаю КБЖУ и иконку
  }
  if (f === "amount" && !i._gramsTouched) i.grams = null;
  if (f === "grams") { i._gramsTouched = true; v = v.replace(",", "."); v = v === "" ? null : +v; }
  i[f] = v;
}
function addIng() { draft.ingredients.push({ name: "", amount: "", grams: null }); drawEdIngs(); }
function delIng(k) { draft.ingredients.splice(k, 1); drawEdIngs(); }
async function save(id) {
  const val = s => $(s).value.trim();
  const body = {
    title: val("f-title") || "Без названия",
    description: val("f-desc"),
    servings: parseInt(val("f-serv")) || null,
    cooked_weight: parseFloat(val("f-weight").replace(",", ".")) || null,
    ingredients: draft.ingredients.filter(i => (i.name || "").trim()).map(({ _orig, _gramsTouched, ...i }) => i),
    steps: val("f-steps").split("\n").map(s => s.trim()).filter(Boolean),
    notes: val("f-notes"),
    tips: val("f-tips").split("\n").map(s => s.trim()).filter(Boolean),
    tags: val("f-tags").split(",").map(s => s.trim()).filter(Boolean),
    source: draft.source || "",
  };
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "Сохраняю и считаю КБЖУ…";
  try {
    const r = id === "new"
      ? await api("/recipes", { method: "POST", body: JSON.stringify(body) })
      : await api("/recipes/" + id, { method: "PUT", body: JSON.stringify(body) });
    haptic("success");
    await loadBoard();
    cur = null; history.replaceState(null, "", "#/r/" + r.id); route();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "Сохранить"; }
}

// ---------- Навигация ----------
async function route() {
  const h = location.hash || "#/";
  let m;
  if (tg) h === "#/" || h === "" ? tg.BackButton.hide() : tg.BackButton.show();
  const card = $("card"), form = $("formPanel");
  try {
    if ((m = h.match(/^#\/r\/(\d+)/))) {
      form.classList.remove("on");
      if (!card.classList.contains("on") || !cur || cur.id !== +m[1]) { await renderCard(m[1]); card.scrollTop = 0; }
      card.classList.add("on");
    } else if ((m = h.match(/^#\/e\/(\d+|new)/))) {
      await renderEdit(m[1]); form.scrollTop = 0; form.classList.add("on");
    } else if (h.startsWith("#/new")) {
      renderNew(); form.scrollTop = 0; form.classList.add("on");
    } else {
      card.classList.remove("on"); form.classList.remove("on"); cur = null;
    }
  } catch (e) { toast(e.message); }
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape" && location.hash && location.hash !== "#/") back(); });

(async () => {
  try { meta = await api("/meta"); } catch (e) {}
  await loadBoard();
  route();
})();
</script>
</body>
</html>
